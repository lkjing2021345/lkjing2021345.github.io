baseURL = 'https://lkjing2021345.github.io/'
locale = 'zh-cn'
hasCJKLanguage = true
title = 'Shimmer の blog'
canonifyURLs = false
relativeURLs = false
theme = "stack"

[params]
  [params.sidebar]
    avatar = "/img/avatar.jpg"
    subtitle = "网络安全爱好者"

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.article]
    toc = true
    readingTime = true

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  # --- Giscus 评论 ---
  [params.comments]
    enabled = true
    provider = "giscus"

    [params.comments.giscus]
      repo             = "lkjing2021345/lkjing2021345.github.io"
      repoID           = "R_kgDOTmocsQ"
      category         = "Announcements"
      categoryID       = "DIC_kwDOTmocsc4DCYb9"
      mapping          = "pathname"
      lightTheme       = "light"
      darkTheme        = "dark_dimmed"
      reactionsEnabled = "1"
      emitMetadata     = "0"
      inputPosition    = "top"
      lang             = "zh-CN"
      strict           = "0"
      loading          = "lazy"

# --- 主导航菜单 ---
[[menu.main]]
    name = "首页"
    url = "/"
    weight = 1

[[menu.main]]
    name = "文章"
    url = "/post/"
    weight = 2

[[menu.main]]
    name = "归档"
    url = "/page/archives/"
    weight = 3

[[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 5

# --- 社交链接（显示在侧边栏） ---
[[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/lkjing2021345"
    [menu.social.params]
        icon = "brand-github"
        newTab = true

[[menu.social]]
    identifier = "bilibili"
    name = "Bilibili"
    url = "https://space.bilibili.com/565536792"
    [menu.social.params]
        icon = "brand-bilibili"
        newTab = true

[[menu.social]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    [menu.social.params]
        icon = "rss"
        newTab = true
